<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cyberpunk Mystic Atmosphere</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1e1e2e;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Arial', sans-serif;
    }
    .glow-container {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      opacity: 0.6;
      filter: blur(10px);
      animation: float 8s infinite ease-in-out;
    }
    .green-glow {
      background-color: #a6e3a1;
      width: 300px;
      height: 300px;
      animation-delay: 0s;
    }
    .violet-accent {
      background-color: #c792ea;
      width: 200px;
      height: 200px;
      animation-delay: 2s;
    }
    @keyframes float {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }
      50% {
        transform: translateY(-20px) rotate(180deg);
      }
    }
  </style>
</head>
<body>
  <div class="glow-container">
    <div class="particle green-glow"></div>
    <div class="particle violet-accent"></div>
  </div>
</body>
</html>
