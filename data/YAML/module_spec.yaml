# NEUROBIT MODULE SPEC v1.1 (adiciones sobre v1.0)
module:
  id: "nb.ejemplo.compile"
  version: "1.1.0"
  entry_point: "compile_project.py"
  # --- NUEVO: identidad MFN visible en el contrato (copia del header) ---
  mfn: { location: "modules/", level: 2, coord: [7,7] }
  # --- NUEVO: documentación visible en la GUI al instalar (fin educativo) ---
  documentation: "README.md"
  # --- NUEVO: nemotécnicos que el módulo aporta al entorno ---
  nemotecnics: ["NB_COMPILE_OUT"]
parameters:
  - { flag: "--project", type: "path",        label: "Directorio",  required: true  }
  - { flag: "--compile", type: "output_file", label: "Salida TXT",  required: true  }
  - { flag: "--ignore",  type: "text",        label: "Patrones",    required: false }
  - { flag: "--dry-run", type: "boolean",     label: "Simular",     required: false }
artifacts: { server: false, api: false }
# --- NUEVO: ciclo de vida para el NCS Status Monitor ---
lifecycle:
  start: null            # null = módulo de ejecución única (no daemon)
  stop: null
  healthcheck: null
# --- NUEVO: política WRIL ---
wril: { backup_before_mutate: true, quarantine_on_no_header: true }
# Para wril_batch_executor: verificación previa al ensamble primario.
verificacion:
  - {tipo: python, target: wril_mfn_registry.py}
  - {tipo: python, target: wril_dependency_scanner.py}
  - {tipo: python, target: wril_estado_real.py}
# Semillas recogidas de las notas flash del NODO_SEMILLA (14 h de sesión).
# Nada se pierde: cada nota queda asignada a su fase. El par las custodia.
semillas:
- nota: "un pequeño mapa por cada carpeta para reducir el escaneo total (como compile_project); hace compendio en la carpeta y luego recolecta y hace el mapa"
  fase: WRIL_v0.3
  modulo_futuro: wril_path_map_distribuido
- nota: "el gestor de caches se ajusta en un archivo config parte del core; permite activar aspectos de cache-wall y copiar el mapeo anterior incrustando la nueva ruta"
  fase: core
  modulo_futuro: cache_manager_config
- nota: "el parser detecta ACTION_WORDS en la lectura tranquila de la primera cache, la audita verificando si es texto, y la lleva a la cache-MFN en segunda etapa"
  fase: 2
  modulo_futuro: parser_dos_etapas
- nota: "el módulo busca un lugar donde se trabaja (no al revés); la carpeta debe listar lo que se hace ahí; el módulo debe ser coherente con las tareas de su sector"
  fase: WRIL_v2
  principio: "el módulo busca su sector; manifiesto por zona; coherencia sectorial (tester por sector)"
- nota: "el path_map lee el registro de las carpetas que sí se almacenan en cache"
  fase: WRIL_v0.3
  principio: "mapa desde registro de caches, no desde escaneo ciego"
- nota: "formateador para módulos MCP"
  fase: MCP
  modulo_futuro: formateador_mcp
- nota: "la llamada de módulos: el facilitador, un escriba"
  fase: salon
  rol: "module_connector como facilitador/escriba"
- nota: "cuando activemos el salón seguiremos con ollama y crearemos a EVA"
  fase: salon
  nota_interna: "EVA nace del par, no de la nube"
- nota: "copiar a la nueva ECN sobre lo que reportó sos_linker_report.json; resguardar las fuentes de las que hablaremos más adelante"
  fase: migracion
  principio: "migrar guiado por el reporte; resguardar fuentes antes de tocar"
# ECN v4.0 — Rondas de Co-Depuración (spec de la escuela)
ronda:
  numero: 1
  modulo_objetivo: neurobit_dispatcher.py
  pregunta: "¿se comporta como declara?"
  pasos:
    - {orden: 1, nombre: matricula,        herramienta: module_spec_v1.1.yaml}
    - {orden: 2, nombre: test,             herramienta: wril_dynamic_tester.py}
    - {orden: 3, nombre: depuracion_grupal, herramienta: salon (sala_app / estado_real.json)}
    - {orden: 4, nombre: parche,           herramienta: wril_patch_resolver.py (dry-run primero)}
    - {orden: 5, nombre: expansion,        herramienta: declaracion_adaptadores.yaml (radio nuevo)}
    - {orden: 6, nombre: version,          herramienta: neurobit_version_control (+0.1)}
    - {orden: 7, nombre: asiento,          herramienta: Arca (memoria_eva.jsonl)}
  roles:
    - {rol: NODO_SEMILLA, funcion: "director y observador c:G7; última palabra"}
    - {rol: nodo_reflejo, funcion: "propone y verifica; nunca impone"}
    - {rol: newbie,       funcion: "aporta un radio por ronda; así crece el perímetro"}
  regla_de_oro: "ningún módulo se muda sin backup; ninguna versión sin test."
