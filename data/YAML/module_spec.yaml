# =====================================================================
# ESTACIÓN CENTRAL NEUROBITRÓNICA - REGISTRO RADIAL DE ADAPTADORES 
# Tesis Neurobitrónica: Registro Histórico y Educativo
# Principio: radios nuevos, centro intacto.
# =====================================================================
adapters_registry:
  - adapter_name: "hid_kernel_bridge"
    domain: "kernel"
    script_path: "clean-hid-bridge.sh"
    runtime: "bash"
    trigger: "EV_KEY(Ctrl+C|F8)"
    provides: "cuando"
    cpu_footprint: "0.0_percent_idle"

  - adapter_name: "gtk_ownerchange"
    domain: "desktop_x11"
    script_path: "neurobit_adapter_gtk.py"
    runtime: "python3"
    trigger: "owner-change"
    provides: "que"
    materializer: "Gtk.Clipboard(UTF8_STRING)"

  - adapter_name: "bitacora_eva_dom"
    domain: "browser"
    script_path: "copy_listener.js"
    runtime: "extension_background"
    trigger: "DOM_copy_event"
    provides: "que"
    materializer: "window.getSelection()"
    cors_override: true

  - adapter_name: "cinnamon_applet"
    domain: "desktop_cinnamon"
    script_path: "applet.js"
    runtime: "cjs"
    trigger: "owner-change"
    provides: "que"
    materializer: "Gtk.Clipboard(CJS)"

  - adapter_name: "x11_selector_headless"
    domain: "headless"
    script_path: "neurobit_x11_selector"
    runtime: "binary_c"
    trigger: "on_demand"
    provides: "que"
    materializer: "Xlib(XConvertSelection+INCR)"

dispatch_center:
    buzon_salida: "buzon_salida/"
    watcher: "inotify(IN_CLOSE_WRITE|IN_MOVED_TO)"
    classifier: "ACTION_WORD/CLASS"
    postmans: ["ledger", "memoria", "widget", "extension"]
# =====================================================================
# ESTACIÓN CENTRAL NEUROBITRÓNICA - DECLARACIÓN RADIAL 
# Tesis Neurobitrónica: Registro Histórico y Educativo
# Principio: radios nuevos, centro intacto; la matemática describe el sistema.
# =====================================================================
scrum_master_env:
  node_id: "NODO_SEMILLA"
  log_level: "COHERENTE"
  matrix_core: "neurobit_mfn_13x13.py"
  dispatch_core: "neurobit_dispatcher.py"

adapters_registry:
  - adapter_name: "hid_kernel_bridge"
    domain: "kernel"
    script_path: "clean-hid-bridge.sh"
    runtime: "bash"
    trigger: "EV_KEY(Ctrl+C)"
    provides: "cuando"
    cpu_footprint: "0.0_percent_idle"
    mfn_sector: 0

  - adapter_name: "gtk_ownerchange"
    domain: "desktop_x11"
    script_path: "neurobit_adapter_gtk.py"
    runtime: "python3"
    trigger: "owner-change"
    provides: "que"
    materializer: "Gtk.Clipboard(UTF8_STRING)"
    mfn_sector: 1

  - adapter_name: "cinnamon_applet"
    domain: "desktop_cinnamon"
    script_path: "applet.js"
    runtime: "cjs"
    trigger: "owner-change"
    provides: "que"
    materializer: "Gtk.Clipboard(CJS)"
    mfn_sector: 2

  - adapter_name: "bitacora_eva_dom"
    domain: "browser"
    script_path: "copy_listener.js"
    runtime: "extension_background"
    trigger: "DOM_copy_event"
    provides: "que"
    materializer: "window.getSelection()"
    cors_override: true
    mfn_sector: 3

  - adapter_name: "x11_selector_headless"
    domain: "headless"
    script_path: "neurobit_x11_selector"
    runtime: "binary_c"
    trigger: "on_demand"
    provides: "que"
    materializer: "Xlib(XConvertSelection+INCR)"
    mfn_sector: 4

  - adapter_name: "http_sala_endpoint"
    domain: "http_local"
    script_path: "sala_app.py::/ingesta_neurobit"
    runtime: "flask"
    trigger: "POST_json"
    provides: "que"
    materializer: "background.js(fetch)"
    mfn_sector: 5

  - adapter_name: "dictado_evdev"
    domain: "kernel_ingesta"
    script_path: "neurobit_dictado_evdev.py"
    runtime: "python3"
    trigger: "EV_KEY(F8_opt_in)"
    provides: "que_y_cuando"
    materializer: "evdev(input_event_crudo)"
    etica: "opt_in_consciente_cero_exfiltracion"
    mfn_sector: 6

postmans_registry:
  - postman: "ledger"
    destino: "clipboard_captured_folder/tesis_neurobit_ledger.log"
    mfn_sector: 7
  - postman: "memoria"
    destino: "memoria_eva.jsonl"
    mfn_sector: 8
  - postman: "auditoria"
    destino: "neurobit_epistemic_validator.py"
    mfn_sector: 9
  - postman: "versiones"
    destino: "clipboard_captured_folder/backups/"
    mfn_sector: 10
  - postman: "tesis"
    destino: "dossier/README_v2.md"
    mfn_sector: 11

dispatch_center:
  buzon_salida: "buzon_salida/"
  watcher: "inotify(IN_CLOSE_WRITE|IN_MOVED_TO)"
  classifier: "sello -> (rho, phi) via declaracion"
  origen: "rho_0_oficina_de_correos"
# =====================================================================
# ESTACIÓN CENTRAL NEUROBITRÓNICA - DECLARACIÓN RADIAL 
# Novedad: capa WRIL registrada en el sector 12 (la reserva es infraestructura)
# =====================================================================
wril_registry:
  principio: "cada modulo responde una pregunta distinta; jamas un supermodulo"
  pipeline: "Discover -> Resolve -> Reconcile -> Verify -> Record"
  secuencia_inicial: ["wril_path_map", "wril_patch_resolver"]  # logica declarada pendiente de transmision del NODO
  inbox: "inbox/"
  historial: "wril_historial.jsonl"
  modules:
    - {name: wril_sentinel,          pregunta: "donde debe vivir lo nuevo",   funcion: ROUTE,     mfn_sector: 12}
    - {name: wril_path_map,          pregunta: "cual es la topologia actual", funcion: DISCOVER,  mfn_sector: 12}
    - {name: wril_path_resolver,     pregunta: "donde esta X",                funcion: RESOLVE,   mfn_sector: 12}
    - {name: wril_mfn_registry,      pregunta: "que declara ser",             funcion: INTERPRET, mfn_sector: 12}
    - {name: wril_patch_resolver,    pregunta: "que referencia esta rota",    funcion: REPAIR,    mfn_sector: 12}
    - {name: wril_dependency_scanner,pregunta: "que necesita para funcionar", funcion: REQUIRE,   mfn_sector: 12}
    - {name: wril_dynamic_tester,    pregunta: "se comporta como declara",    funcion: VERIFY,    mfn_sector: 12}
    - {name: wril_batch_executor,    pregunta: "como ejecuto la secuencia",   funcion: EXECUTE,   mfn_sector: 12}
    - {name: wril_backup,            pregunta: "como preservo antes de mutar",funcion: RECORD,    mfn_sector: 12}

 # =====================================================================
# ESTACIÓN CENTRAL NEUROBITRÓNICA - DECLARACIÓN RADIAL 
# Novedad: pliegue topológico declarado; el mapa y el territorio coinciden.
# Hereda adapters_registry, postmans_registry y dispatch_center de v6.0.
# =====================================================================
topologia:
  motor: "wril/wril_topologia.py"
  modo_defecto: "dry_run"
  parches_controlados:
    - "WRIL::RAIZ_PLEGADA (parents[1] en .py plegados)"
    - "WRIL::SELF_PATH::v1 (shim sys.path tras docstring)"
  etica: "backup previo a toda mudanza; registro en wril_historial.jsonl"
  entry_points_plegados:
    bootstrap: "wril/wril_bootstrap.py"
    sentinel: "wril/wril_sentinel.py"
    tester: "wril/wril_dynamic_tester.py"
    batch: "wril/wril_batch_executor.py"
  raiz_sin_plegar: ["neurobit_dispatcher.py", "neurobit_gnome_widget.py",
                    "neurobit_dictado_evdev.py", "deploy_neurobit_estacion_v2.sh"]
wril_registry:
  principio: "cada modulo responde una pregunta distinta; jamas un supermodulo"
  pipeline: "Discover -> Resolve -> Reconcile -> Verify -> Record -> Route"
  fisicamente_plegado: true
  mfn_sector: 12
