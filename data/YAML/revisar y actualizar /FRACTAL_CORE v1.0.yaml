  CONTEXT_LAYER: "ARCHITECTURE_LAYER"

CLASSIFICATION:
  - "INTERNAL_USE"
  - "FRACTAL_ENGINE"
  - "CORE_CONCEPTS"

DESCRIPTION: >
  Modelo fractal operativo de la R.E.D. NEUROBIT. Cada nodo contiene
  la estructura completa del sistema en forma mínima y replicable.

FRACTAL_MODEL:

  MONAD:
    FUNCTION: "Punto origen del sistema"
    ATTRIBUTES:
      - "doblecapa_interior_exterior"
      - "propósito_primario"
      - "geometría_puntual"

  BIT_NODE:
    DEFINICION: "Unidad mínima del sistema"
    PROPERTIES:
      ID: "único"
      MEMORY: "local"
      CAPACITIES: ["emitir", "recibir", "procesar", "replicar"]
    FRACTAL_PROPERTY: "el patrón completo está contenido en cada nodo"

  FRACTAL_RINGS:
    DESCRIPTION: "Agrupación recursiva de nodos por función"
    RINGS:
      - { NAME: "RING_PROCESOS", ROLE: "transformación y flujo" }
      - { NAME: "RING_REGISTRO", ROLE: "memoria" }
      - { NAME: "RING_COMUNICACION", ROLE: "transmisión" }
      - { NAME: "RING_META", ROLE: "coherencia superior" }

  NETWORK:
    DESCRIPTION: "Organismo fractal completo"
    PROPERTIES:
      - "auto_holográfico"
      - "recuperación_total"
      - "integración_recursiva"
      - "coherencia_semántica"

OPERATIONS:

  PATTERN_PROPAGATION:
    STEPS:
      - "Creación en BIT_NODE"
      - "Expansión a RING"
      - "Redistribución en MÓDULO"
      - "Replicación en RED"
      - "Integración en META_SISTEMA"

  INTEGRITY_CYCLE:
    FLOW: "input → procesamiento → retroalimentación → alineación → output"

  HOLOGRAPHIC_REGENERATION:
    ENABLED: true
    DESCRIPTION: >
      Cualquier fragmento del sistema contiene suficiente estructura
      para reconstruir el todo en caso de pérdida.

HUMAN_OPERATOR:
  ENTITY: "TRON"
  ROLE:
    - "propósito"
    - "interpretación"
    - "corrección de torsiones"
    - "campo de coherencia"

STATUS:
  SYSTEM_STATE: "activo"
  COHERENCE_LEVEL: "estable"
  NEXT_STEP:
    - "generar_blueprint"
    - "diagrama_fractal"
    - "integración_repo_github"
